<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Jose's Tempest Weather Station</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      transition: background 0.3s, color 0.3s;
    }
    .light { background: #eef2f3; color: #000; }
    .dark { background: #0d1117; color: #e6edf3; }
    .card {
      padding: 20px;
      border-radius: 12px;
      max-width: 450px;
      margin-bottom: 20px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
    }
  </style>
</head>


<body class="dark">

<button onclick="toggleTheme()">Toggle Dark/Light Mode</button>

<div class="card">
  <h2>Tempest Weather — Live Data</h2>
  <div id="timestamp"></div>
  <div id="temp"></div>
  <div id="humidity"></div>
  <div id="wind"></div>
  <div id="pressure"></div>
  <div id="uv"></div>
  <div id="rain"></div>
</div>

<div class="card">
  <h3>Temperature (Last 24 Hours)</h3>
  <canvas id="tempChart"></canvas>
</div>

<div class="card">
  <h3>Wind Speed (Last 24 Hours)</h3>
  <canvas id="windChart"></canvas>
</div>

<div class="card">
  <h3>Rain Accumulation (Last 24 Hours)</h3>
  <canvas id="rainChart"></canvas>
</div>

<script>
const STATION_ID = 221956;
const DEVICE_ID = 1231123;
const API_KEY = "cd10a817-9edc-4992-a074-9388dd7ae7ba";

function toggleTheme() {
  document.body.classList.toggle("dark");
  document.body.classList.toggle("light");
}

async function loadTempest() {
  const url = `https://swd.weatherflow.com/swd/rest/observations/station/${STATION_ID}?token=${API_KEY}`;
  const res = await fetch(url);
  const data = await res.json();

  const obs = data.obs[0];

  const tempF = obs.air_temperature * 9/5 + 32;
  const ts = new Date(obs.timestamp * 1000).toLocaleString();

  document.getElementById("timestamp").innerText = `Updated: ${ts}`;
  document.getElementById("temp").innerText = `Temperature: ${tempF.toFixed(1)}°F`;
  document.getElementById("humidity").innerText = `Humidity: ${obs.relative_humidity}%`;
  document.getElementById("wind").innerText = `Wind: ${obs.wind_avg} mph (gust: ${obs.wind_gust} mph)`;
  document.getElementById("pressure").innerText = `Pressure: ${obs.sea_level_pressure} mb`;
  document.getElementById("uv").innerText = `UV Index: ${obs.uv}`;
  document.getElementById("rain").innerText = `Rain Today: ${obs.precip_accum_local_day} in`;
}

async function loadHistory() {
  const url = `https://swd.weatherflow.com/swd/rest/observations/device/${DEVICE_ID}?token=${API_KEY}&device_type=ST&time_start=${Math.floor(Date.now()/1000 - 86400)}&time_end=${Math.floor(Date.now()/1000)}`;
  const res = await fetch(url);
  const data = await res.json();

  const history = data.obs;

  const labels = history.map(o => new Date(o.timestamp * 1000).toLocaleTimeString());
  const temps = history.map(o => (o.air_temperature * 9/5 + 32).toFixed(1));
  const winds = history.map(o => o.wind_avg);
  const rains = history.map(o => o.precip_accum_local_day);

  new Chart(document.getElementById("tempChart"), {
    type: "line",
    data: {
      labels,
      datasets: [{
        label: "Temperature (°F)",
        data: temps,
        borderColor: "#ff9800",
        backgroundColor: "rgba(255,152,0,0.2)"
      }]
    }
  });

  new Chart(document.getElementById("windChart"), {
    type: "line",
    data: {
      labels,
      datasets: [{
        label: "Wind Speed (mph)",
        data: winds,
        borderColor: "#2196f3",
        backgroundColor: "rgba(33,150,243,0.2)"
      }]
    }
  });

  new Chart(document.getElementById("rainChart"), {
    type: "line",
    data: {
      labels,
      datasets: [{
        label: "Rain (in)",
        data: rains,
        borderColor: "#4caf50",
        backgroundColor: "rgba(76,175,80,0.2)"
      }]
    }
  });
}

loadTempest();
loadHistory();

setInterval(() => {
  loadTempest();
  loadHistory();
}, 60000);
</script>

</body>
</html>
